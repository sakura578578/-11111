<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 05 · 单摆物理仿真 | 龙勤涛 7904126014</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a24; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 16px;
    font: 13px/1.7 Consolas, "Courier New", monospace;
    color: #8fd3ff; text-shadow: 0 0 6px rgba(143, 211, 255, .5);
    user-select: none; pointer-events: none;
  }
  #hud b { color: #e0f2ff; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 18px; padding: 12px 20px;
    background: rgba(20, 20, 30, 0.82);
    border-top: 1px solid rgba(143, 211, 255, 0.18);
    backdrop-filter: blur(6px);
    font: 13px/1.4 Consolas, "Courier New", monospace;
    color: #8fd3ff;
  }
  #panel label { display: flex; align-items: center; gap: 8px; }
  #panel .val { min-width: 52px; color: #e0f2ff; text-shadow: 0 0 6px rgba(143,211,255,.5); }
  #panel input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 150px; height: 4px; border-radius: 2px;
    background: #3a4a6a; outline: none; cursor: pointer;
  }
  #panel input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #7cc8ff; border: 2px solid #2b6cb0;
    box-shadow: 0 0 8px rgba(120, 210, 255, 0.8);
  }
  #resetBtn {
    padding: 6px 16px; border-radius: 4px; cursor: pointer;
    border: 1px solid rgba(143, 211, 255, 0.5);
    background: rgba(120, 210, 255, 0.12);
    color: #cfeaff; font: inherit;
    transition: background .15s, box-shadow .15s;
  }
  #resetBtn:hover {
    background: rgba(120, 210, 255, 0.28);
    box-shadow: 0 0 10px rgba(120, 210, 255, 0.45);
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="panel">
  <label>摆长 L
    <input type="range" id="sliderL" min="100" max="350" step="1" value="200">
    <span class="val" id="valL">200 px</span>
  </label>
  <label>重力 g
    <input type="range" id="sliderG" min="1" max="25" step="0.1" value="9.8">
    <span class="val" id="valG">9.8</span>
  </label>
  <label>阻尼 k
    <input type="range" id="sliderK" min="0" max="0.010" step="0.0005" value="0.005">
    <span class="val" id="valK">0.0050</span>
  </label>
  <button id="resetBtn" type="button">重置摆动</button>
</div>
<div id="hud">
  <div><b>单摆仿真</b> · θ = -（g/L）·sin θ - k·ω</div>
  <div>摆角 θ: <span id="readTheta"></span> rad</div>
  <div>角速度 ω: <span id="readOmega"></span> rad/s</div>
  <div>周期 T≈2π√(L/g): <span id="readPeriod"></span> s</div>
</div>
<script>
'use strict';

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

const PX_PER_M = 100;
const params = {
  L: 200,
  g: 9.8,
  theta0: 45 * Math.PI / 180,
  k: 0.005,
};

const state = { theta: params.theta0, omega: 0 };

let W = 0, H = 0, pivotX = 0, pivotY = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pivotX = W / 2;
  pivotY = H * 0.22;
}
window.addEventListener('resize', resize);
resize();

const SUBSTEP = 1 / 240;
function stepPhysics(dt) {
  let remaining = Math.min(dt, 0.05);
  const Lm = params.L / PX_PER_M;
  while (remaining > 0) {
    const h = Math.min(SUBSTEP, remaining);
    const alpha = -(params.g / Lm) * Math.sin(state.theta) - params.k * state.omega;
    state.omega += alpha * h;
    state.theta += state.omega * h;
    remaining -= h;
  }
}

const trail = [];
const TRAIL_MAX = 90;

function draw() {
  ctx.fillStyle = '#1a1a24';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(143, 211, 255, 0.08)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 48) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 48) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  const bx = pivotX + params.L * Math.sin(state.theta);
  const by = pivotY + params.L * Math.cos(state.theta);

  trail.push({ x: bx, y: by });
  if (trail.length > TRAIL_MAX) trail.shift();
  for (let i = 1; i < trail.length; i++) {
    const a = i / trail.length;
    ctx.strokeStyle = 'rgba(120, 200, 255, ' + (a * 0.25).toFixed(3) + ')';
    ctx.lineWidth = 2 * a;
    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.stroke();
  }

  ctx.strokeStyle = '#3a4a6a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(pivotX, pivotY);
  ctx.lineTo(bx, by);
  ctx.stroke();

  ctx.fillStyle = '#6a7a9a';
  ctx.beginPath();
  ctx.arc(pivotX, pivotY, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#cfd8ea';
  ctx.beginPath();
  ctx.arc(pivotX, pivotY, 3, 0, Math.PI * 2);
  ctx.fill();

  const R = 18;
  ctx.save();
  ctx.shadowColor = 'rgba(120, 210, 255, 0.9)';
  ctx.shadowBlur = 32;
  const grad = ctx.createRadialGradient(bx - 5, by - 6, 2, bx, by, R);
  grad.addColorStop(0, '#eaf7ff');
  grad.addColorStop(0.45, '#7cc8ff');
  grad.addColorStop(1, '#2b6cb0');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(bx, by, R, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  readTheta.textContent = state.theta.toFixed(3);
  readOmega.textContent = state.omega.toFixed(3);
}

const readTheta = document.getElementById('readTheta');
const readOmega = document.getElementById('readOmega');
const readPeriod = document.getElementById('readPeriod');

function updatePeriod() {
  readPeriod.textContent =
    (2 * Math.PI * Math.sqrt((params.L / PX_PER_M) / params.g)).toFixed(2);
}
updatePeriod();

const sliderL = document.getElementById('sliderL');
const sliderG = document.getElementById('sliderG');
const sliderK = document.getElementById('sliderK');

sliderL.addEventListener('input', () => {
  params.L = Number(sliderL.value);
  document.getElementById('valL').textContent = params.L + ' px';
  trail.length = 0;
  updatePeriod();
});
sliderG.addEventListener('input', () => {
  params.g = Number(sliderG.value);
  document.getElementById('valG').textContent = params.g.toFixed(1);
  updatePeriod();
});
sliderK.addEventListener('input', () => {
  params.k = Number(sliderK.value);
  document.getElementById('valK').textContent = params.k.toFixed(4);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  state.theta = params.theta0;
  state.omega = 0;
  trail.length = 0;
});

let last = performance.now();
function frame(now) {
  const dt = (now - last) / 1000;
  last = now;
  stepPhysics(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
